# checkout / upload-artifact 当前最新大版本是 v7；v8 尚未发布。
# setup-java 官方仍建议生产用 v5（v6 标为 in development）。
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-android-build

      - name: Test and assemble debug
        run: ./gradlew --stacktrace :app:test :app:assembleDebug

      - uses: actions/upload-artifact@v7
        with:
          name: SkipSkip-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
