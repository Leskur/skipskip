# checkout / upload-artifact @v7；发版用 softprops/action-gh-release@v3。
# 推送 v*.*.* 标签时打 release 签名 APK 并创建 GitHub Release。
# 签名密钥来自仓库 Secrets（勿把 keystore 提交进本仓）。
name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-android-build

      - name: Decode signing keystore
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "Missing secret SIGNING_KEYSTORE_BASE64"
            exit 1
          fi
          echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > skipskip-release.keystore

      - name: Test and assemble release
        env:
          SIGNING_STORE_FILE: ${{ github.workspace }}/skipskip-release.keystore
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
        run: ./gradlew --stacktrace :app:test :app:assembleRelease

      - name: Stage APK
        shell: bash
        run: |
          mkdir -p dist
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            version="${GITHUB_REF_NAME}"
          else
            version="${GITHUB_SHA::7}"
          fi
          cp app/build/outputs/apk/release/app-release.apk "dist/SkipSkip-${version}.apk"

      - uses: actions/upload-artifact@v7
        with:
          name: SkipSkip
          path: dist/*.apk
          if-no-files-found: error

      - uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/*.apk
          generate_release_notes: true
          prerelease: ${{ startsWith(github.ref_name, 'v0.') }}
