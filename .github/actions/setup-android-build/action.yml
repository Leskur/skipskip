name: Setup Android build
description: Temurin 17、Gradle 缓存、接受 Android SDK 许可

runs:
  using: composite
  steps:
    - uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: "17"
        cache: gradle
    # v4 默认会装已下架的 `tools` 包，sdkmanager 会直接失败。
    - uses: android-actions/setup-android@v4
      with:
        packages: platform-tools
    - name: Make gradlew executable
      shell: bash
      run: chmod +x gradlew
