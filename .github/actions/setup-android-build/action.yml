name: Setup Android build
description: Temurin 17、Gradle 缓存、接受 Android SDK 许可

runs:
  using: composite
  steps:
    - uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: "17"
        cache: gradle
    - uses: android-actions/setup-android@v4
    - name: Make gradlew executable
      shell: bash
      run: chmod +x gradlew
